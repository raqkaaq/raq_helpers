[project]
name = "raq-helpers"
version = "0.1.0"
description = "A helper Library with useful functionality for RaqLib projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datamodel-code-generator>=0.87.0",
    "dotenv>=0.9.9",
    "hishel[httpx2,redis]>=1.4.0",
    "httpx2>=2.16.0",
    "ipykernel>=7.4.0",
    "pytimeparse2>=1.7.1",
    "pydantic>=2.12",
]

[dependency-groups]
dev = [
    "fakeredis>=2.32",
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
    "pytest-cov>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["raq_helpers"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
