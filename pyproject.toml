[project]
name = "raq-helpers"
version = "0.1.0"
description = "A helper Library with useful functionality for RaqLib projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datamodel-code-generator>=0.87.0",
    "dotenv>=0.9.9",
    "hishel>=1.4.0",
    "httpx2>=2.16.0",
    "ipykernel>=7.4.0",
    "pytimeparse2>=1.7.1",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
